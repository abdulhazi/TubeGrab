name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unzip project
        run: |
          unzip -o -q TubeGrab.zip -d unzipped
          GRADLEW=$(find unzipped -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then echo "gradlew not found in zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/TubeGrab.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TubeGrab build ${{ github.run_number }}
          files: TubeGrab.apk
          make_latest: true
